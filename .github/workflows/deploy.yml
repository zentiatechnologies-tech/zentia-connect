name: Deploy to zentiaai.com

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-zentiaai
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Build the site
        run: npm run build

      - name: Upload to Namecheap hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      # Checks each page's SEO basics and logs this update in the dashboard.
      # Needs the DASHBOARD_INGEST_TOKEN repository secret; never fails the deploy.
      - name: Check pages and log the update
        if: success()
        continue-on-error: true
        env:
          DASHBOARD_INGEST_TOKEN: ${{ secrets.DASHBOARD_INGEST_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Manual website deploy' }}
        run: node scripts/audit.mjs --report
