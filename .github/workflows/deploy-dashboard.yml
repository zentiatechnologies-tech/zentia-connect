name: Deploy dashboard to dash.zentiaai.com

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "src/assets/**"
      - "vite.dashboard.config.ts"
      - "tailwind.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".env.production"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

concurrency:
  group: deploy-dashboard
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Build the dashboard
        run: npm run build:dashboard

      # The subdomain's folder on the hosting account, relative to the FTP
      # login's home. Set the DASHBOARD_FTP_DIR repository variable if yours
      # differs from ./dash/ (see DASHBOARD.md).
      - name: Upload to Namecheap hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist-dashboard/
          server-dir: ${{ vars.DASHBOARD_FTP_DIR || './dash/' }}
